<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle de inspección</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 16px; color:#222; }
  h1 { font-size: 1.3rem; border-bottom: 2px solid #333; padding-bottom: 8px; }
  .campo { margin: 6px 0; }
  .campo b { display:inline-block; min-width: 190px; }
  .seccion { margin-top: 20px; }
  .seccion h2 { font-size: 1.05rem; background:#f0f0f0; padding:6px 10px; border-radius:4px; margin-bottom: 8px;}
  .falla { color:#b00020; font-weight:bold; margin: 4px 0; }
  #loading { text-align:center; padding: 40px 0; color:#888; }
  a { color:#1a5fb4; }
  .fotos { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; }
  .foto-bloque { text-align:center; }
  .foto-label { font-size:0.8rem; color:#555; margin-bottom:4px; }
  img.foto { max-width:300px; max-height:500px; border-radius:6px; border:1px solid #ddd; object-fit:cover; }
</style>
</head>
<body>
  <div id="loading">Cargando inspección...</div>
  <div id="contenido" style="display:none;"></div>

<script>
  // ⚠️ Pegar acá la URL que termina en /exec del Web App de Apps Script
  const DATA_API_URL = 'https://script.google.com/macros/s/AKfycbw_JjMkzv0lH15C5yBaC5yVxCn_m-mQKOR5uUB7Bf0HTqQhPN4KCKLc2jU4LFP6cQ5YfA/exec';

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) {
    document.getElementById('loading').textContent = 'Falta el parámetro id en la URL.';
  } else if (DATA_API_URL.indexOf('PEGAR_ACA') !== -1) {
    document.getElementById('loading').textContent = 'Falta configurar DATA_API_URL en este archivo.';
  } else {
    fetch(DATA_API_URL + '?id=' + encodeURIComponent(id))
      .then(function(r) { return r.json(); })
      .then(function(datos) {
        if (datos.error) {
          document.getElementById('loading').textContent = 'Error: ' + datos.error;
          return;
        }
        mostrarDatos(datos);
      })
      .catch(function(err) {
        document.getElementById('loading').textContent = 'Error al cargar los datos: ' + err;
      });
  }

  function campo(label, valor) {
    if (!valor) return '';
    return '<div class="campo"><b>' + label + ':</b> ' + valor + '</div>';
  }

  function fallaBloque(titulo, valorFalla, valorDesc) {
    if (!valorFalla) return '';
    return '<div class="falla">' + titulo + ': ' + valorFalla + (valorDesc ? ' — ' + valorDesc : '') + '</div>';
  }

  function foto(label, url) {
    if (!url) return '';
    return '<div class="foto-bloque"><div class="foto-label">' + label + '</div>' +
           '<a href="' + url + '" target="_blank"><img class="foto" src="' + url + '" loading="lazy" /></a></div>';
  }

  function mostrarDatos(d) {
    var html = '<h1>Inspección ' + (d['IDInspIzaje'] || '') + '</h1>';

    html += campo('Fecha', d['Submission Date']);
    html += campo('Cliente', d['Cliente']);
    html += campo('OT', d['OT']);
    html += campo('Equipo', d['IDEquipoIZ']);
    html += campo('Tipo de equipo', d['Tipo de equipo']);
    html += campo('Serie', d['Serie']);
    html += campo('Modelo', d['Modelo']);
    html += campo('Año fabricación', d['Año Fabricación']);
    html += campo('Capacidad máx. (Kg)', d['Capacidad de Carga Máxima en Kg']);
    html += campo('Montada sobre vehículo', d['Montada sobre vehículo?']);
    html += campo('Marca/modelo vehículo', d['Marca y Modelo Vehículo']);
    html += campo('Patente', d['Patente Vehículo']);

    if (d['Foto del equipo'] || d['Foto de la Chapa']) {
      html += '<div class="seccion"><h2>Fotos</h2><div class="fotos">';
      html += foto('Equipo', d['Foto del equipo']);
      html += foto('Chapa', d['Foto de la Chapa']);
      html += '</div></div>';
    }

    html += '<div class="seccion"><h2>Mecánica</h2>';
    html += campo('Estado', d['Fijaciones y articulaciones mecánicas (chavetas, pasadores, ganchos, grilletes, cables, apertura de apoyos, funcionamiento de comandos, estado de neumáticos, soldaduras, grietas, abolladuras)']);
    for (var n = 1; n <= 3; n++) {
      html += fallaBloque('Falla ' + n, d['Falla mecánica ' + n], d['Descripción Falla Mecánica ' + n]);
    }
    html += '</div>';

    html += '<div class="seccion"><h2>Hidráulica</h2>';
    html += campo('Estado', d['Circuito hidráulica (pérdidas de aceite, válvulas desconectadas, caños mal sujetados, mangueras dañadas)']);
    for (var m = 1; m <= 3; m++) {
      html += fallaBloque('Falla ' + m, d['Falla Hidráulica ' + m], d['Descripción Falla Hidráulica ' + m]);
    }
    html += '</div>';

    html += '<div class="seccion"><h2>Eléctrica</h2>';
    html += campo('Sistema eléctrico', d['Sistema eléctrico']);
    html += fallaBloque('Falla', d['Falla eléctrica 1'], d['Descripción Falla Eléctrica 1']);
    html += '</div>';

    html += '<div class="seccion"><h2>Resultado</h2>';
    html += campo('Diagrama de carga a la vista', d['Diagrama de carga a la vista y claro']);
    html += campo('Parada de seguridad', d['Parada de seguridad']);
    html += campo('Prueba funcional', d['Prueba funcional']);
    html += campo('Carga utilizada (Kg)', d['Carga utilizada en Kg']);
    if (d['Foto de diagrama de carga'] || d['Foto de Prueba Funcional']) {
      html += '<div class="fotos">';
      html += foto('Diagrama de carga', d['Foto de diagrama de carga']);
      html += foto('Prueba funcional', d['Foto de Prueba Funcional']);
      html += '</div>';
    }
    html += '</div>';

    if (d['URL Informe PDF']) {
      html += '<div class="seccion"><a href="' + d['URL Informe PDF'] + '" target="_blank">📄 Ver informe completo en PDF</a></div>';
    }

    document.getElementById('contenido').innerHTML = html;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('contenido').style.display = 'block';
  }
</script>
</body>
</html>
